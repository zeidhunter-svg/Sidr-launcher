org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Этап 2.1 — AGP 9.0 defaults to built-in Kotlin support + a new DSL, incompatible with the
# explicit org.jetbrains.kotlin.android plugin this project applies in every module. Migrating to
# the new DSL is a separate, broader decision (touches every module's plugin block) than "bump the
# toolchain version numbers" — opt out for now, keep the explicit kotlin-android plugin working as
# before. See https://developer.android.com/build/migrate-to-built-in-kotlin.
android.builtInKotlin=false
# builtInKotlin=false alone isn't enough — AGP 9.0's new DSL (android.newDsl, also default true) is
# what actually rejects the explicit org.jetbrains.kotlin.android plugin. Opt out of both together.
android.newDsl=false

kotlin.code.style=official
